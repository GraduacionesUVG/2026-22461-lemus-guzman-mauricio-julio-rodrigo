monitores:
- nombre: CP-08 Salud API Veltrix
  tipo: http
  configuracion:
    url: http://127.0.0.1:8000/api/health
    metodo: GET
    estados_esperados:
    - 200
    texto_esperado: ok
- nombre: Disponibilidad frontend Veltrix
  tipo: http
  configuracion:
    url: http://127.0.0.1:5350/
    metodo: GET
    estados_esperados:
    - 200
- nombre: CP-09 TCP backend Veltrix
  tipo: tcp
  configuracion:
    host: 127.0.0.1
    puerto: 8000
    tiempo_espera: 5
- nombre: CP-09 TCP frontend Veltrix
  tipo: tcp
  configuracion:
    host: 127.0.0.1
    puerto: 5350
    tiempo_espera: 5
- nombre: CP-07 API catalogo publico Aurora (disponibilidad)
  tipo: api
  configuracion:
    url: http://127.0.0.1:8000/api/public/aurora/products
    metodo: GET
    estados_esperados:
    - 200
    texto_esperado: name
    tiempo_espera: 15
- nombre: CP-10 Falla controlada servicio auxiliar
  tipo: api
  configuracion:
    url: http://127.0.0.1:8766/health
    metodo: GET
    estados_esperados:
    - 200
    tiempo_espera: 3
pipelines:
- nombre: Pipeline 01 Autenticacion y navegacion
  detener_ante_fallo: false
  pasos:
  - orden: 1
    tipo: caso_prueba
    referencia: CP-02 Autenticacion incorrecta
  - orden: 2
    tipo: caso_prueba
    referencia: CP-01 Autenticacion exitosa propietario
  - orden: 3
    tipo: caso_prueba
    referencia: CP-03 Navegacion entre modulos
- nombre: Pipeline 02 Catalogo publico
  detener_ante_fallo: false
  pasos:
  - orden: 1
    tipo: monitor
    referencia: CP-07 API catalogo publico Aurora (disponibilidad)
  - orden: 2
    tipo: caso_prueba
    referencia: CP-07 Catalogo publico con contenido visible
- nombre: Pipeline 03 Monitoreo
  detener_ante_fallo: false
  pasos:
  - orden: 1
    tipo: monitor
    referencia: CP-08 Salud API Veltrix
  - orden: 2
    tipo: monitor
    referencia: Disponibilidad frontend Veltrix
  - orden: 3
    tipo: monitor
    referencia: CP-09 TCP backend Veltrix
  - orden: 4
    tipo: monitor
    referencia: CP-09 TCP frontend Veltrix
  - orden: 5
    tipo: monitor
    referencia: CP-07 API catalogo publico Aurora (disponibilidad)
- nombre: Pipeline 04 Fallos controlados y alertas
  detener_ante_fallo: false
