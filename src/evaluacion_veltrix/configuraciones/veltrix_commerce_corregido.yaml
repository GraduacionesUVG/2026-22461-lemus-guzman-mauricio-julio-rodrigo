# Veltrix Commerce - configuracion local revisada (UVG)
# Validada como YAML y con referencias internas consistentes.
# IMPORTANTE: esta configuracion contiene CP-01, CP-02, CP-03 y CP-11,
# monitoreo HTTP/TCP/API, mas un fallo controlado CP-10.
# NO implementa CP-04, CP-05, CP-06 ni CP-12 como pruebas integrales.
# CP-07 es una comprobacion HTTP, no verifica visibilidad de productos.
# Antes de ejecutar CP-01/03/11, configurar secreto veltrix_owner_password.
# Antes de ejecutar Pipeline 02/03 verificar la ruta del catalogo publico.
# Pipeline 04 es intencionalmente negativo, NO usar como smoke test.
version: 1
proyecto:
  nombre: Veltrix Commerce campaña experimental
  descripcion: Campaña experimental UVG con escenarios funcionales, monitoreo, fallos controlados y alertas
  tecnologia_referencial: FastAPI + React + PostgreSQL
  responsable: Trabajo de Graduacion UVG
entornos:
- nombre: laboratorio local
  url_base: http://127.0.0.1:5350
  zona_horaria: America/Guatemala
  verificar_certificado_tls: false
  tiempo_espera_segundos: 15
modulos_objetivo:
- nombre: Autenticacion
  critico: true
- nombre: Navegacion
  critico: true
- nombre: Inventario y ventas
  critico: true
- nombre: Catalogo publico
  critico: true
- nombre: Monitoreo
  critico: true
- nombre: Alertas
  critico: true
secretos_requeridos:
- veltrix_owner_password
casos_prueba:
- nombre: CP-01 Autenticacion exitosa propietario
  modulo_objetivo: Autenticacion
  prioridad: alta
  pasos:
  - orden: 1
    tipo: navegar
    nombre: Abrir login
    configuracion:
      ruta: /login
  - orden: 2
    tipo: escribir
    nombre: Ingresar correo propietario
    configuracion:
      selector:
        estrategia: css
        valor: input[type="email"]
      texto: usuario@example.invalid
  - orden: 3
    tipo: escribir
    nombre: Ingresar contrasena desde secreto
    configuracion:
      selector:
        estrategia: css
        valor: input[type="password"]
      secreto: veltrix_owner_password
  - orden: 4
    tipo: hacer_clic
    nombre: Enviar login
    configuracion:
      selector:
        estrategia: css
        valor: button[type="submit"]
  - orden: 5
    tipo: esperar_elemento
    nombre: Esperar dashboard
    configuracion:
      selector:
        estrategia: texto
        valor: Dashboard
      condicion: visible
      timeout_segundos: 15
  - orden: 6
    tipo: validar_texto
    nombre: Validar tienda Aurora
    configuracion:
      selector:
        estrategia: xpath
        valor: //*[contains(normalize-space(.), 'Aurora Boutique')]
      texto_esperado: Aurora Boutique
  - orden: 7
    tipo: capturar_evidencia
    nombre: Captura dashboard autenticado
    configuracion:
      nombre: CP01_dashboard_aurora
- nombre: CP-02 Autenticacion incorrecta
  modulo_objetivo: Autenticacion
  prioridad: alta
  pasos:
  - orden: 1
    tipo: navegar
    nombre: Abrir login
    configuracion:
      ruta: /login
  - orden: 2
    tipo: escribir
    nombre: Ingresar correo valido no registrado
    configuracion:
      selector:
        estrategia: css
        valor: input[type="email"]
      texto: usuario.invalido@example.com
  - orden: 3
    tipo: escribir
    nombre: Ingresar contrasena invalida
    configuracion:
      selector:
        estrategia: css
        valor: input[type="password"]
      texto: REEMPLAZAR_SECRETO_LOCAL
  - orden: 4
    tipo: hacer_clic
    nombre: Enviar login
    configuracion:
      selector:
        estrategia: css
        valor: button[type="submit"]
  - orden: 5
    tipo: esperar_elemento
    nombre: Esperar mensaje de credenciales invalidas
    configuracion:
      selector:
        estrategia: css
        valor: '[role="alert"]'
      condicion: visible
      timeout_segundos: 15
  - orden: 6
    tipo: validar_texto
    nombre: Verificar el mensaje de rechazo
    configuracion:
      selector:
        estrategia: css
        valor: body
      texto_esperado: Email o contraseña incorrectos
  - orden: 7
    tipo: esperar_url
    nombre: Verificar que sigue en login
    configuracion:
      texto_url: /login
      comparacion: contiene
      timeout_segundos: 10
  - orden: 8
    tipo: capturar_evidencia
    nombre: Captura rechazo login
    configuracion:
      nombre: CP02_rechazo_login
