version: 1
proyecto:
  nombre: VELTRIX Commerce - Campana QA 20261101 Q7M4
  descripcion: Evaluacion funcional y monitoreo de VELTRIX Commerce en entorno local controlado. No ejecutar en
    produccion.
  tecnologia_referencial: React FastAPI Selenium
  responsable: Trabajo Profesional de Graduacion UVG
modulos_objetivo:
- nombre: Autenticacion
  descripcion: Login autorizado y control de acceso
  critico: true
- nombre: Navegacion
  descripcion: Rutas y areas principales
  critico: false
- nombre: Clientes
  descripcion: Datos ficticios propios de la campana
  critico: false
- nombre: Inventario
  descripcion: Altas, consultas y existencias
  critico: true
- nombre: Ventas
  descripcion: Registro, cancelacion e historial
  critico: true
- nombre: Monitoreo
  descripcion: Disponibilidad y deteccion de fallos
  critico: true
entornos:
- nombre: Laboratorio local VELTRIX Commerce
  url_base: http://127.0.0.1:5350
  zona_horaria: America/Guatemala
  verificar_certificado_tls: true
  tiempo_espera_segundos: 20
casos_prueba:
- nombre: CP-01 Autenticacion correcta
  descripcion: Acceso autorizado y dashboard visible.
  modulo_objetivo: Autenticacion
  prioridad: alta
  requiere_revision_humana: false
  pasos:
  - orden: 1
    tipo: navegar
    nombre: Abrir inicio de sesion
    configuracion:
      ruta: /login
    continuar_si_falla: false
  - orden: 2
    tipo: esperar_elemento
    nombre: Esperar formulario
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="email"]
      condicion: visible
    continuar_si_falla: false
  - orden: 3
    tipo: escribir
    nombre: Ingresar correo autorizado
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="email"]
      texto: usuario@example.invalid
    continuar_si_falla: false
  - orden: 4
    tipo: escribir
    nombre: Ingresar contrasena desde secreto
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="password"]
      secreto: REEMPLAZAR_SECRETO_LOCAL
    continuar_si_falla: false
  - orden: 5
    tipo: hacer_clic
    nombre: Enviar credenciales
    configuracion:
      selector:
        estrategia: css
        valor: form button[type="submit"]
    continuar_si_falla: false
  - orden: 6
    tipo: esperar_elemento
    nombre: Confirmar navegacion autenticada
    configuracion:
      selector:
        estrategia: css
        valor: nav a[href="/productos"]
      condicion: visible
    continuar_si_falla: false
  - orden: 7
    tipo: esperar_elemento
    nombre: Esperar informacion del dashboard
    configuracion:
      selector:
        estrategia: xpath
        valor: //main//h3[normalize-space(.)='Ventas por día']
      condicion: visible
    continuar_si_falla: false
  - orden: 8
    tipo: capturar_evidencia
    nombre: Guardar evidencia CP01_login_correcto
    configuracion:
      nombre: CP01_login_correcto
    continuar_si_falla: false
- nombre: CP-02 Autenticacion incorrecta
  descripcion: Rechazo sin crear sesion.
  modulo_objetivo: Autenticacion
  prioridad: alta
  requiere_revision_humana: false
  pasos:
  - orden: 1
    tipo: navegar
    nombre: Abrir /login
    configuracion:
      ruta: /login
    continuar_si_falla: false
  - orden: 2
    tipo: esperar_elemento
    nombre: Esperar formulario
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="email"]
      condicion: visible
      timeout_segundos: 20
    continuar_si_falla: false
  - orden: 3
    tipo: escribir
    nombre: Correo de prueba invalido
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="email"]
      texto: qa.invalido@example.com
      timeout_segundos: 20
    continuar_si_falla: false
  - orden: 4
    tipo: escribir
    nombre: Clave de prueba invalida
    configuracion:
      selector:
        estrategia: css
        valor: form input[type="password"]
      texto: ClaveInvalida-QA-2026
      timeout_segundos: 20
    continuar_si_falla: false
  - orden: 5
    tipo: hacer_clic
    nombre: Enviar intento invalido
    configuracion:
      selector:
        estrategia: css
        valor: form button[type="submit"]
      timeout_segundos: 20
    continuar_si_falla: false
  - orden: 6
    tipo: esperar_texto
    nombre: Comprobar rechazo
    configuracion:
      selector:
        estrategia: css
        valor: form [role="alert"]
      texto_esperado: Email o contraseña incorrectos
      timeout_segundos: 20
    continuar_si_falla: false
  - orden: 7
    tipo: validar_url
    nombre: Confirmar que permanece en login
    configuracion:
      url_esperada: /login
      comparacion: contiene
    continuar_si_falla: false
  - orden: 8
    tipo: capturar_evidencia
    nombre: Guardar evidencia CP02_rechazo_login
    configuracion:
      nombre: CP02_rechazo_login
    continuar_si_falla: false
